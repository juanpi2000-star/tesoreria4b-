<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><title>Tesorería del Curso</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}header{position:sticky;top:0;z-index:5;background:#090b10ee;backdrop-filter:blur(12px);padding:18px 0 8px}h1{margin:0;font-size:25px}.muted{color:#9098a8;font-size:13px;margin-top:5px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.card,.panel{background:#12151c;border:1px solid #252b36;border-radius:16px}.card{padding:14px}.label{color:#929aaa;font-size:12px}.value{font-size:21px;font-weight:800;margin-top:5px}.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 12px}.tab{background:#12151c;color:#dfe4ee;border:1px solid #303746;border-radius:11px;padding:9px 13px;white-space:nowrap}.tab.active{background:#eef2f6;color:#080a0e}.panel{padding:14px;margin-bottom:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #303746}input{background:#0b0e13;color:white;flex:1;min-width:170px}button{background:#e9edf3;color:#080a0e;font-weight:700;cursor:pointer}.dark{background:#202631;color:#e7ebf2}.student{border-top:1px solid #252b36;padding:13px 2px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.name{font-weight:700}.status{font-size:12px;color:#9098a8;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:12px;padding:8px}.paid{background:#173523;color:#9cf0b0}.transfer{background:#172c3b;color:#9ddcff}.pending{background:#342d18;color:#f2d788}.inactive{background:#292d34;color:#b4bbc6}.row{display:flex;justify-content:space-between;border-bottom:1px solid #252b36;padding:9px 0;font-size:13px}.empty{text-align:center;color:#858d9c;padding:20px}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:span 2}.student{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style></head><body><header><div class="wrap"><h1>💰 Tesorería del Curso</h1><div class="muted">Marzo a diciembre · Cuota mensual $5.000</div></div></header><main class="wrap"><div class="cards"><div class="card"><div class="label">Recaudado</div><div class="value" id="total">$0</div></div><div class="card"><div class="label">Pendiente</div><div class="value" id="debt">$0</div></div><div class="card"><div class="label">Pagos</div><div class="value" id="payments">0</div></div></div><div id="tabs" class="tabs"></div><section class="panel"><div class="controls"><input id="search" placeholder="Buscar alumno…"><button class="dark" id="export">⬇️ Excel</button><button class="dark" id="undo">↩️ Deshacer</button></div><div id="list"></div></section><section class="panel"><b>Resumen por mes</b><div id="summary"></div></section></main><script>
const alumnos=["Pazcal Alarcón", "Benjamín Amigo", "Nyce Arriagada", "Cristian Bastías", "Rafaela Burgos", "Gissella Calzadilla", "Oscar Candia", "Kiara Cayún", "Camilo Espinoza", "Angelo Espinoza", "Jason Gamonal", "Juan Pablo Henríquez", "Carla Mora", "Cristinne Mora", "Josefa Mora", "Martín Mora", "Paula Oliva", "Jorge Osorio", "Brayan Pérez", "Pedro Pretton", "Fabián Quezada", "Luis Quezada", "Juan Marcos Recabal", "Carolina Rivas", "Martina Rivera", "Sofía Romero", "Luis Romero", "Gabriela Sepúlveda", "Ailinne Torres", "Denise Torres", "Camilo Urrutia", "Hans Urrutia", "Marcela Vargas", "Mayte Vera", "Luka Vitta", "Javiera Zapata", "Catalina Zavala"];
const meses=["Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"], cuota=5000;let mes=0,db=JSON.parse(localStorage.getItem("tesoreriaCurso")||"{}"),hist=[];
const $=id=>document.getElementById(id), key=(m,i)=>m+"_"+i, get=(m,i)=>db[key(m,i)]||{s:"pending",method:""};
function money(n){return "$"+n.toLocaleString("es-CL")}
function save(){localStorage.setItem("tesoreriaCurso",JSON.stringify(db))}
function set(i,s,method=""){hist.push(JSON.stringify(db));db[key(meses[mes],i)]={s,method};save();render()}
function render(){
$('tabs').innerHTML=meses.map((m,i)=>`<button class="tab ${i===mes?'active':''}" onclick="mes=${i};render()">${m}</button>`).join('');
let q=$('search').value.toLowerCase(),m=meses[mes];$('list').innerHTML=alumnos.map((n,i)=>({n,i,s:get(m,i)})).filter(x=>x.n.toLowerCase().includes(q)).map(x=>`<div class="student"><div><div class="name">${x.n}</div><div class="status">${x.s.s==='paid'?'Pagó':x.s.s==='inactive'?'No participa':'Pendiente'}${x.s.method?' · '+x.s.method:''}</div></div><div class="actions"><button class="paid" onclick="set(${x.i},'paid','Efectivo')">💵 Efectivo</button><button class="transfer" onclick="set(${x.i},'paid','Transferencia')">📲 Transfer.</button><button class="pending" onclick="set(${x.i},'pending')">Pendiente</button><button class="inactive" onclick="set(${x.i},'inactive')">No participa</button></div></div>`).join('')||'<div class="empty">No se encontraron alumnos.</div>';
let total=0,debt=0,pay=0;meses.forEach(mm=>alumnos.forEach((n,i)=>{let s=get(mm,i);if(s.s==='paid'){total+=cuota;pay++}else if(s.s==='pending')debt+=cuota}));$('total').textContent=money(total);$('debt').textContent=money(debt);$('payments').textContent=pay;
$('summary').innerHTML=meses.map(mm=>{let p=0,d=0,np=0;alumnos.forEach((n,i)=>{let s=get(mm,i);p+=s.s==='paid';d+=s.s==='pending';np+=s.s==='inactive'});return `<div class="row"><span>${mm}</span><span>${p} pagaron · ${d} pendientes · ${np} no participa</span></div>`}).join('')}
$('search').oninput=render;$('undo').onclick=()=>{if(hist.length){db=JSON.parse(hist.pop());save();render()}};$('export').onclick=()=>{let rows=[['Alumno','Mes','Estado','Método','Monto']];meses.forEach(m=>alumnos.forEach((n,i)=>{let s=get(m,i);rows.push([n,m,s.s==='paid'?'Pagó':s.s==='inactive'?'No participa':'Pendiente',s.method||'',s.s==='paid'?cuota:0])}));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='tesoreria_curso.csv';a.click();};render();
</script></body></html>
