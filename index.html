<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><title>Tesorería del Curso</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:16px}header{position:sticky;top:0;z-index:5;background:#090b10ee;padding:18px 0 8px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.card,.panel{background:#12151c;border:1px solid #252b36;border-radius:16px}.card{padding:14px}.label{color:#929aaa;font-size:12px}.value{font-size:21px;font-weight:800;margin-top:5px}.cash .value{color:#9cf0b0}.transfer .value{color:#9ddcff}.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0 12px}.tab{background:#12151c;color:#dfe4ee;border:1px solid #303746;border-radius:11px;padding:9px 13px;white-space:nowrap}.tab.active{background:#eef2f6;color:#080a0e}.panel{padding:14px;margin-bottom:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #303746}input{background:#0b0e13;color:white;flex:1;min-width:170px}button{background:#e9edf3;color:#080a0e;font-weight:700;cursor:pointer}.dark{background:#202631;color:#e7ebf2}.student{border-top:1px solid #252b36;padding:13px 2px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.name{font-weight:700}.status{font-size:12px;color:#9098a8;margin-top:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.actions button{font-size:12px;padding:8px}.paid{background:#173523;color:#9cf0b0}.transferBtn{background:#172c3b;color:#9ddcff}.pending{background:#342d18;color:#f2d788}.annual{background:#3b1f35;color:#f3b7dc}.reactivate{background:#18362c;color:#a9f0d0}.notice{background:#21182a;border:1px solid #493052;color:#e9c8ee;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #252b36;padding:9px 0;font-size:13px}@media(max-width:850px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:span 2}.student{grid-template-columns:1fr}.actions{justify-content:flex-start}.row{flex-direction:column;gap:4px}}</style></head><body><header><div class="wrap"><h1>💰 Tesorería del Curso</h1><div class="muted">Marzo a diciembre · Cuota mensual $5.000</div></div></header><main class="wrap"><div class="cards"><div class="card"><div class="label">💰 Recaudado total</div><div class="value" id="total">$0</div></div><div class="card cash"><div class="label">💵 Efectivo</div><div class="value" id="cash">$0</div></div><div class="card transfer"><div class="label">📲 Transferencias</div><div class="value" id="transfers">$0</div></div><div class="card"><div class="label">⏳ Pendiente</div><div class="value" id="debt">$0</div></div><div class="card"><div class="label">🧾 Pagos</div><div class="value" id="payments">0</div></div></div><div id="tabs" class="tabs"></div><section class="panel"><div class="controls"><input id="search" placeholder="Buscar alumno…"><button class="dark" id="export">⬇️ Excel</button><button class="dark" id="undo">↩️ Deshacer</button></div><div class="notice">💡 <b>No participa año</b> lo aplica automáticamente de marzo a diciembre y no genera deuda.</div><div id="list"></div></section><section class="panel"><b>Resumen por mes</b><div id="summary"></div></section></main><script>
const alumnos=["Pazcal Alarcón","Benjamín Amigo","Nyce Arriagada","Cristian Bastías","Rafaela Burgos","Gissella Calzadilla","Oscar Candia","Kiara Cayún","Camilo Espinoza","Angelo Espinoza","Jason Gamonal","Juan Henríquez","Carla Mora","Cristinne Mora","Josefa Mora","Martín Mora","Paula Oliva","Jorge Osorio","Brayan Pérez","Pedro Pretton","Fabián Quezada","Luis Quezada","Juan Recabal","Carolina Rivas","Martina Rivera","Sofía Romero","Luis Romero","Gabriela Sepúlveda","Ailinne Torres","Denise Torres","Camilo Urrutia","Hans Urrutia","Marcela Vargas","Mayte Vera","Luka Vitta","Javiera Zapata","Catalina Zavala"];
const meses=["Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],cuota=5000;let mes=0,db=JSON.parse(localStorage.getItem("tesoreriaCurso")||"{}"),hist=[];const $=id=>document.getElementById(id),key=(m,i)=>m+"_"+i;function annual(i){return db.annualInactive&&db.annualInactive[i]===true}function get(m,i){if(annual(i))return{s:"inactive",method:"Todo el año"};return db[key(m,i)]||{s:"pending",method:""}}function money(n){return "$"+n.toLocaleString("es-CL")}function save(){localStorage.setItem("tesoreriaCurso",JSON.stringify(db))}function snapshot(){hist.push(JSON.stringify(db));if(hist.length>30)hist.shift()}function set(i,s,method=""){snapshot();if(!db.annualInactive)db.annualInactive={};db.annualInactive[i]=false;db[key(meses[mes],i)]={s,method};save();render()}function noParticipaAno(i){snapshot();if(!db.annualInactive)db.annualInactive={};db.annualInactive[i]=true;save();render()}function reactivate(i){snapshot();if(!db.annualInactive)db.annualInactive={};db.annualInactive[i]=false;save();render()}function render(){$("tabs").innerHTML=meses.map((m,i)=>`<button class="tab ${i===mes?'active':''}" onclick="mes=${i};render()">${m}</button>`).join("");const q=$("search").value.toLowerCase(),m=meses[mes];$("list").innerHTML=alumnos.map((n,i)=>({n,i,s:get(m,i)})).filter(x=>x.n.toLowerCase().includes(q)).map(x=>{const anual=annual(x.i);return `<div class="student"><div><div class="name">${x.n}</div><div class="status">${x.s.s==='paid'?'Pagó':x.s.s==='inactive'?'🚫 No participa todo el año':'Pendiente'}${x.s.method?' · '+x.s.method:''}</div></div><div class="actions">${anual?`<button class="reactivate" onclick="reactivate(${x.i})">↩️ Reactivar año</button>`:`<button class="paid" onclick="set(${x.i},'paid','Efectivo')">💵 Efectivo</button><button class="transferBtn" onclick="set(${x.i},'paid','Transferencia')">📲 Transfer.</button><button class="pending" onclick="set(${x.i},'pending')">Pendiente</button><button class="annual" onclick="noParticipaAno(${x.i})">🚫 No participa año</button>`}</div></div>`}).join("")||'<div>No se encontraron alumnos.</div>';let total=0,cash=0,transfers=0,debt=0,pay=0;meses.forEach(mm=>alumnos.forEach((n,i)=>{const s=get(mm,i);if(s.s==='paid'){total+=cuota;pay++;if(s.method==='Efectivo')cash+=cuota;if(s.method==='Transferencia')transfers+=cuota}else if(s.s==='pending')debt+=cuota}));$("total").textContent=money(total);$("cash").textContent=money(cash);$("transfers").textContent=money(transfers);$("debt").textContent=money(debt);$("payments").textContent=pay;$("summary").innerHTML=meses.map(mm=>{let p=0,d=0,np=0,c=0,t=0;alumnos.forEach((n,i)=>{const s=get(mm,i);if(s.s==='paid'){p++;if(s.method==='Efectivo')c+=cuota;if(s.method==='Transferencia')t+=cuota}if(s.s==='pending')d++;if(s.s==='inactive')np++});return `<div class="row"><span><b>${mm}</b></span><span>${p} pagaron · ${d} pendientes · ${np} no participa · 💵 ${money(c)} · 📲 ${money(t)}</span></div>`}).join("")}$("search").oninput=render;$("undo").onclick=()=>{if(hist.length){db=JSON.parse(hist.pop());save();render()}};$("export").onclick=()=>{let rows=[["Alumno","Mes","Estado","Método","Monto"]];meses.forEach(m=>alumnos.forEach((n,i)=>{let s=get(m,i);rows.push([n,m,s.s==='paid'?'Pagó':s.s==='inactive'?'No participa':'Pendiente',s.method||'',s.s==='paid'?cuota:0])}));let csv="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='tesoreria_curso.csv';a.click()};render();</script></body></html>
